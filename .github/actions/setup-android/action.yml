name: Chrona Android Toolchain

description: Set up the pinned Chrona Java, Gradle and Android SDK build toolchain.

inputs:
  install-native:
    description: Install Chrona's pinned CMake and NDK toolchain.
    required: false
    default: 'true'

runs:
  using: composite
  steps:
    - name: Setup JDK 25 runtime
      uses: actions/setup-java@v6.0.1
      with:
        distribution: temurin
        java-version: '25'
        cache-jdk: true

    - name: Setup JDK 17 compilation toolchain
      uses: actions/setup-java@v6.0.1
      id: setup-java-17
      with:
        distribution: temurin
        java-version: '17'
        set-default: false

    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v6.2.0
      with:
        cache-provider: basic

    - name: Setup Android SDK command-line tools
      uses: android-actions/setup-android@v4.0.4
      with:
        cmdline-tools-version: '15859902'
        packages: ''

    - name: Install pinned Android SDK packages
      shell: bash
      run: |
        set -euo pipefail
        # 37.1 is required for compileSdk 37 / compileSdkMinor 1.
        sdkmanager --sdk_root="${ANDROID_SDK_ROOT}" \
          'platform-tools' \
          'platforms;android-37.1' \
          'build-tools;37.0.0'

    - name: Install native toolchain
      if: inputs.install-native == 'true'
      shell: bash
      run: |
        set -euo pipefail
        sdkmanager --sdk_root="${ANDROID_SDK_ROOT}" \
          'cmake;3.31.5' \
          'ndk;28.2.13676358'
