name: Metrics

# Renders repository metrics (lowlighter/metrics) to metrics.svg on the
# dedicated `metrics` branch, which README.md embeds. Keeping the image off
# `main` avoids a bot commit on the integration branch every day.
# Requires a METRICS_TOKEN secret (classic PAT with public_repo + read:user).

on:
  schedule:
    - cron: '17 1 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: metrics
  cancel-in-progress: true

jobs:
  metrics:
    name: Render metrics
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
    env:
      METRICS_TOKEN: ${{ secrets.METRICS_TOKEN }}
    steps:
      - name: Check token
        id: token
        run: |
          if [[ -z "$METRICS_TOKEN" ]]; then
            printf '::notice::METRICS_TOKEN is not set; skipping metrics rendering.\n'
            printf 'available=false\n' >> "$GITHUB_OUTPUT"
          else
            printf 'available=true\n' >> "$GITHUB_OUTPUT"
          fi
      - name: Checkout
        if: steps.token.outputs.available == 'true'
        uses: actions/checkout@v7
      - name: Ensure metrics branch exists
        if: steps.token.outputs.available == 'true'
        run: |
          if git ls-remote --exit-code --heads origin metrics > /dev/null; then
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git switch --orphan metrics
          git commit --allow-empty -m 'chore(metrics): initialize metrics branch'
          git push origin metrics
      - name: Render repository metrics
        if: steps.token.outputs.available == 'true'
        uses: lowlighter/metrics@v3.34
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          committer_token: ${{ github.token }}
          committer_branch: metrics
          committer_message: 'chore(metrics): update metrics.svg'
          filename: metrics.svg
          template: repository
          user: ${{ github.repository_owner }}
          repo: ${{ github.event.repository.name }}
          base: header, activity, community, repositories, metadata
          config_timezone: Asia/Jakarta
          plugin_languages: yes
          plugin_languages_details: bytes-size, percentage
          plugin_lines: yes
          plugin_followup: yes
          plugin_traffic: yes
