name: Debug Matrix

on:
  push:
    branches: [main, master, develop]
  pull_request:
    branches: [main, master, develop]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: debug-${{ github.ref }}
  cancel-in-progress: true

env:
  JAVA_VERSION: '17'
  ANDROID_PLATFORM_VERSION: '37'
  ANDROID_BUILD_TOOLS: '37.0.0'
  ANDROID_NDK_VERSION: '28.2.13676358'
  ANDROID_CMAKE_VERSION: '3.31.6'

jobs:
  debug:
    name: Debug • ${{ matrix.task }} • ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { task: audit, os: ubuntu-24.04 }
          - { task: unit, os: ubuntu-24.04 }
          - { task: lint, os: ubuntu-24.04 }
          - { task: android17, os: ubuntu-24.04 }
          - { task: assemble, os: ubuntu-24.04 }
    steps:
      - uses: actions/checkout@v7
      - name: Setup Java
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}
          cache: ${{ matrix.task != 'audit' && 'gradle' || '' }}
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
      - name: Install Android packages
        shell: bash
        run: |
          set -euo pipefail
          yes | sdkmanager --licenses >/dev/null 2>&1 || true
          sdkmanager --sdk_root="${ANDROID_SDK_ROOT}" --install \
            "platform-tools" \
            "platforms;android-${ANDROID_PLATFORM_VERSION}" \
            "build-tools;${ANDROID_BUILD_TOOLS}" \
            "cmake;${ANDROID_CMAKE_VERSION}" \
            "ndk;${ANDROID_NDK_VERSION}"
      - name: Verify environment
        shell: bash
        run: |
          set -euo pipefail
          echo "Runner: $(uname -a)"
          echo "Architecture: $(uname -m)"
          echo "JAVA_HOME: ${JAVA_HOME}"
          echo "ANDROID_SDK_ROOT: ${ANDROID_SDK_ROOT}"
          command -v java
          command -v sdkmanager
          chmod +x ./gradlew
          java -version
          ./gradlew --version
          test -d "$ANDROID_SDK_ROOT/platforms/android-${ANDROID_PLATFORM_VERSION}"
          test -d "$ANDROID_SDK_ROOT/build-tools/${ANDROID_BUILD_TOOLS}"
          test -d "$ANDROID_SDK_ROOT/cmake/${ANDROID_CMAKE_VERSION}"
          test -d "$ANDROID_SDK_ROOT/ndk/${ANDROID_NDK_VERSION}"
      - name: Run selected task
        shell: bash
        run: |
          set -euo pipefail
          case '${{ matrix.task }}' in
            audit) bash scripts/source-audit.sh ;;
            unit) ./gradlew --no-daemon --stacktrace test ;;
            lint) ./gradlew --no-daemon --stacktrace lint ;;
            android17) bash scripts/verify-android17.sh ;;
            assemble) ./gradlew --no-daemon --stacktrace assembleDebug ;;
            *) echo "Unknown task: ${{ matrix.task }}"; exit 2 ;;
          esac
      - name: Upload debug APK
        if: matrix.task == 'assemble'
        uses: actions/upload-artifact@v4
        with:
          name: chrona-debug-${{ github.sha }}
          path: '**/build/outputs/apk/debug/*.apk'
          if-no-files-found: error
          retention-days: 14
