name: Release

# stable branch + vX.Y.Z tags -> signed Release build, Android SDK stable channel (0).
# Pushes to `stable` build and verify the signed APKs; tags (or a manual run
# with a tag) also publish the GitHub Release.

on:
  push:
    branches:
      - stable
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      tag:
        description: Existing vX.Y.Z tag to (re)publish; leave empty to only build
        required: false
        type: string
        default: ''

permissions:
  contents: read

concurrency:
  group: release-${{ inputs.tag || github.ref }}
  cancel-in-progress: false

jobs:
  prepare:
    name: Prepare
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      ref: ${{ steps.meta.outputs.ref }}
      tag: ${{ steps.meta.outputs.tag }}
      publish: ${{ steps.meta.outputs.publish }}
    steps:
      - name: Resolve release
        id: meta
        env:
          INPUT_TAG: ${{ inputs.tag }}
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          tag="$INPUT_TAG"
          if [[ -z "$tag" && "$REF_TYPE" == tag ]]; then tag="$REF_NAME"; fi
          if [[ -n "$tag" ]]; then
            [[ "$tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] || { printf '::error::Invalid version tag: %s\n' "$tag"; exit 1; }
            printf 'ref=%s\ntag=%s\npublish=true\n' "refs/tags/$tag" "$tag" >> "$GITHUB_OUTPUT"
          else
            printf 'ref=%s\ntag=\npublish=false\n' "$GITHUB_REF" >> "$GITHUB_OUTPUT"
          fi
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: ${{ steps.meta.outputs.ref }}
      - name: Generate changelog
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/release/generate_changelog.py "${{ steps.meta.outputs.tag || github.ref_name }}" > release-notes.md
      - name: Upload changelog
        uses: actions/upload-artifact@v7
        with:
          name: chrona-changelog-${{ github.run_id }}
          path: release-notes.md
          if-no-files-found: error
          retention-days: 90

  build:
    name: Signed Release APK · SDK stable
    needs: prepare
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    environment: release
    permissions:
      contents: read
      id-token: write
      attestations: write
      artifact-metadata: write
    outputs:
      version-name: ${{ steps.version.outputs.name }}
      compile-sdk: ${{ steps.toolchain.outputs.compile-sdk }}
      build-tools: ${{ steps.toolchain.outputs.build-tools }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: ${{ needs.prepare.outputs.ref }}
      - name: Android toolchain
        id: toolchain
        uses: ./.github/actions/android-toolchain
        with:
          sdk-channel: 0
      - name: Resolve version
        id: version
        run: bash scripts/ci/resolve_version.sh release
      - name: Materialize release keystore
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: bash scripts/ci/materialize_keystore.sh
      - name: Build release APKs
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          set -o pipefail
          status=0
          ./gradlew --no-daemon --stacktrace assembleRelease 2>&1 | tee release-build.log || status=$?
          if (( status != 0 )); then
            python3 scripts/ci/extract_build_errors.py release-build.log release-build-errors.log
          fi
          exit "$status"
      - name: Verify ABI outputs
        run: python3 scripts/ci/verify_abi_outputs.py app/build/outputs/apk/release release
      - name: Package APKs
        run: bash scripts/ci/package_apks.sh app/build/outputs/apk/release release "Chrona-v${{ steps.version.outputs.name }}"
      - name: Attest release APKs
        uses: actions/attest@v4
        with:
          subject-path: release/*.apk
      - name: Upload release files
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: chrona-release-${{ github.run_id }}
          path: |
            release/*
            release-build.log
            release-build-errors.log
          if-no-files-found: ignore
          retention-days: 90

  publish:
    name: Publish GitHub Release
    needs:
      - prepare
      - build
    if: needs.prepare.outputs.publish == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Download release files
        uses: actions/download-artifact@v8
        with:
          name: chrona-release-${{ github.run_id }}
          path: dist
      - name: Download changelog
        uses: actions/download-artifact@v8
        with:
          name: chrona-changelog-${{ github.run_id }}
          path: changelog
      - name: Check for a Release Drafter release
        id: existing
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.prepare.outputs.tag }}
        run: |
          # Keep notes written by Release Drafter; only fill in notes for new releases.
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
            printf 'body-path=\n' >> "$GITHUB_OUTPUT"
          else
            printf 'body-path=changelog/release-notes.md\n' >> "$GITHUB_OUTPUT"
          fi
      - name: Publish release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ needs.prepare.outputs.tag }}
          name: Chrona ${{ needs.prepare.outputs.tag }}
          body_path: ${{ steps.existing.outputs.body-path }}
          draft: false
          prerelease: false
          make_latest: true
          files: |
            dist/release/*.apk
            dist/release/SHA256SUMS.txt
          fail_on_unmatched_files: true

  telegram:
    name: Telegram release
    needs:
      - prepare
      - build
      - publish
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Download release files
        uses: actions/download-artifact@v8
        continue-on-error: true
        with:
          pattern: chrona-*-${{ github.run_id }}
          path: telegram
      - name: Send Telegram release report
        continue-on-error: true
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.CHRONABOT_RELEASE_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.CHRONABOT_RELEASE_CHAT_ID }}
          TELEGRAM_EVENT: release-report
          TELEGRAM_ARTIFACT_DIR: telegram
          PREPARE_RESULT: ${{ needs.prepare.result }}
          BUILD_RESULT: ${{ needs.build.result }}
          PUBLISH_RESULT: ${{ needs.publish.result }}
          RELEASE_VERSION: ${{ needs.prepare.outputs.tag || needs.build.outputs.version-name }}
        run: python3 scripts/telegram/notify.py
