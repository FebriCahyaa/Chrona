name: Chrona Release

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      tag:
        description: Existing version tag to release
        required: true
        type: string

permissions:
  contents: write
  id-token: write
  attestations: write
  artifact-metadata: write

concurrency:
  group: chrona-release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  prepare:
    name: Prepare Release
    runs-on: ubuntu-24.04
    outputs:
      tag: ${{ steps.meta.outputs.tag }}
      version: ${{ steps.meta.outputs.version }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: ${{ inputs.tag || github.ref_name }}
      - name: Resolve version
        id: meta
        shell: bash
        env:
          INPUT_TAG: ${{ inputs.tag }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          tag="$INPUT_TAG"
          if [[ -z "$tag" ]]; then tag="$REF_NAME"; fi
          [[ "$tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] || { printf 'Invalid version tag: %s\n' "$tag" >&2; exit 1; }
          printf 'tag=%s\n' "$tag" >> "$GITHUB_OUTPUT"
          printf 'version=%s\n' "${tag#v}" >> "$GITHUB_OUTPUT"
      - name: Generate changelog
        run: python3 scripts/release/generate_changelog.py "${{ steps.meta.outputs.tag }}" > release-notes.md
      - name: Upload changelog
        uses: actions/upload-artifact@v7
        with:
          name: chrona-changelog-${{ steps.meta.outputs.tag }}
          archive: false
          path: release-notes.md
          if-no-files-found: error
          retention-days: 90

  build:
    name: Signed Release APK
    needs: prepare
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    environment: release
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: ${{ inputs.tag || github.ref_name }}
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.13'
      - name: Set up Java
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: |
            platform-tools
            platforms;android-37.2
            build-tools;37.1.0

      - name: Verify Android SDK platform and build tools
        run: python3 scripts/ci/verify_android_sdk.py
      - name: Fetch Google assets
        run: python3 scripts/assets/fetch_google_assets.py
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: wrapper
      - name: Materialize release keystore
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        shell: bash
        run: |
          [[ -n "$ANDROID_KEYSTORE_BASE64" ]] || { printf 'ANDROID_KEYSTORE_BASE64 is required.\n' >&2; exit 1; }
          [[ -n "$ANDROID_KEYSTORE_PASSWORD" ]] || { printf 'ANDROID_KEYSTORE_PASSWORD is required.\n' >&2; exit 1; }
          keystore="$RUNNER_TEMP/chrona-release.jks"
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$keystore"
          chmod 600 "$keystore"
          keytool -list \
            -storetype JKS \
            -keystore "$keystore" \
            -storepass "$ANDROID_KEYSTORE_PASSWORD" \
            -alias chrona-release \
            >/dev/null || { printf 'Release keystore validation failed. Check ANDROID_KEYSTORE_BASE64 and ANDROID_KEYSTORE_PASSWORD.\n' >&2; exit 1; }
          printf 'ANDROID_KEYSTORE_FILE=%s\n' "$keystore" >> "$GITHUB_ENV"
      - name: Build release
        id: build
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        shell: bash
        run: |
          [[ -n "$ANDROID_KEYSTORE_PASSWORD" ]] || { printf 'ANDROID_KEYSTORE_PASSWORD is required.\n' >&2; exit 1; }
          [[ -f "$ANDROID_KEYSTORE_FILE" ]] || { printf 'Materialized release keystore was not found.\n' >&2; exit 1; }
          set -o pipefail
          set +e
          ./gradlew --no-daemon assembleRelease 2>&1 | tee release-build.log
          status=${PIPESTATUS[0]}
          set -e
          python3 scripts/ci/extract_build_errors.py release-build.log release-build-errors.log
          exit "$status"
      - name: Verify release ABI outputs
        run: python3 scripts/ci/verify_abi_outputs.py app/build/outputs/apk/release release
      - name: Prepare release files
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p release
          shopt -s nullglob
          apks=(app/build/outputs/apk/release/*.apk)
          (( ${#apks[@]} == 5 )) || { printf 'Expected 5 release APKs (4 ABI + universal), found %s.\n' "${#apks[@]}" >&2; exit 1; }
          for apk in "${apks[@]}"; do
            base=$(basename "$apk")
            cp "$apk" "release/Chrona-${{ needs.prepare.outputs.tag }}-${base}"
          done
          sha256sum release/*.apk > release/SHA256SUMS.txt
      - name: Upload release files
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: chrona-release-${{ needs.prepare.outputs.tag }}
          archive: true
          path: |
            release/*
            release-build.log
            release-build-errors.log
          if-no-files-found: ignore
          retention-days: 90
      - name: Attest release APKs
        if: success()
        uses: actions/attest@v4
        with:
          subject-path: release/*.apk

  publish:
    name: Publish GitHub Release
    needs:
      - prepare
      - build
    if: needs.build.result == 'success'
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Download release files
        uses: actions/download-artifact@v8
        with:
          name: chrona-release-${{ needs.prepare.outputs.tag }}
          path: release
      - name: Download changelog
        uses: actions/download-artifact@v8
        with:
          name: chrona-changelog-${{ needs.prepare.outputs.tag }}
          path: changelog
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.prepare.outputs.tag }}
        shell: bash
        run: |
          gh release create "$TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --title "Chrona $TAG" \
            --notes-file changelog/release-notes.md \
            release/*.apk \
            release/SHA256SUMS.txt

  telegram:
    name: Telegram Release
    needs:
      - prepare
      - build
      - publish
    if: always()
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Download release files
        uses: actions/download-artifact@v8
        with:
          name: chrona-release-${{ needs.prepare.outputs.tag }}
          path: telegram/release
        continue-on-error: true
      - name: Download changelog
        uses: actions/download-artifact@v8
        with:
          name: chrona-changelog-${{ needs.prepare.outputs.tag }}
          path: telegram/changelog
        continue-on-error: true
      - name: Send Telegram release report
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.CHRONABOT_RELEASE_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.CHRONABOT_RELEASE_CHAT_ID }}
          TELEGRAM_EVENT: release-report
          TELEGRAM_ARTIFACT_DIR: telegram
          PREPARE_RESULT: ${{ needs.prepare.result }}
          BUILD_RESULT: ${{ needs.build.result }}
          PUBLISH_RESULT: ${{ needs.publish.result }}
          RELEASE_VERSION: ${{ needs.prepare.outputs.tag }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_SERVER_URL: ${{ github.server_url }}
          GITHUB_RUN_ID: ${{ github.run_id }}
          GITHUB_RUN_ATTEMPT: ${{ github.run_attempt }}
          GITHUB_SHA: ${{ github.sha }}
          GITHUB_ACTOR: ${{ github.actor }}
          GITHUB_WORKFLOW: ${{ github.workflow }}
        run: python3 scripts/telegram/notify.py
        continue-on-error: true
