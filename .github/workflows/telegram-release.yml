name: Telegram / Release

on:
  release:
    types: [published, prereleased]

permissions:
  contents: read

jobs:
  notify:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: ${{ github.event.repository.default_branch }}
      - uses: actions/setup-python@v6.1.0
        with:
          python-version: '3.13'
      - name: Send release notification
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.CHRONABOT_RELEASE_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.CHRONABOT_RELEASE_CHAT_ID }}
          GITHUB_TOKEN: ${{ github.token }}
        run: python3 scripts/telegram/notify.py --kind release
