name: CodeQL

on:
  push:
    branches: ["main", "master", "develop"]
  pull_request:
  schedule:
    - cron: '31 2 * * 1'
  workflow_dispatch:

permissions:
  contents: read
  security-events: write
  actions: read

concurrency:
  group: codeql-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analyze:
    name: Analyze Android sources
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Fix Gradle wrapper permissions
        shell: bash
        run: |
          set -euo pipefail
          chmod +x ./gradlew
          test -x ./gradlew
          ls -l ./gradlew

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools'
          accept-android-sdk-licenses: true

      - name: Install Android 17 SDK 37 toolchain
        shell: bash
        run: |
          set -euo pipefail
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager --install --channel=1 \
            'platforms;android-37.0' \
            'build-tools;37.0.0' \
            'cmake;3.31.6' \
            'ndk;30.0.16248370'

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: java, c-cpp
          build-mode: manual

      - name: Build for CodeQL extraction
        run: |
          set -euo pipefail
          chmod +x ./gradlew
          test -x ./gradlew
          ./gradlew --no-daemon assembleDebug --stacktrace

      - name: Analyze
        uses: github/codeql-action/analyze@v4
        with:
          category: /languages:java-cpp
