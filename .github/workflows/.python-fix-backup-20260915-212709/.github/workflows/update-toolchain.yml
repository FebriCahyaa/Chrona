name: Update Chrona Toolchain

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: chrona-toolchain
  cancel-in-progress: false

env:
  JAVA_VERSION: "17"
  ANDROID_API: "37"
  BUILD_TOOLS_VERSION: "36.0.0"
  NDK_VERSION: "30.0.16248370"
  CMAKE_VERSION: "3.31.6"
  GRADLE_VERSION: "9.6.1"

jobs:
  update:
    name: Update Gradle and Android Toolchain
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}
          cache: gradle

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4

      - name: Locate SDK tools
        shell: bash
        run: |
          set -euo pipefail

          echo "ANDROID_HOME=${ANDROID_HOME:-}"
          echo "ANDROID_SDK_ROOT=${ANDROID_SDK_ROOT:-}"

          command -v sdkmanager
          sdkmanager --version

      - name: Accept Android SDK licenses
        shell: bash
        run: |
          set -euo pipefail

          yes | sdkmanager --licenses >/dev/null 2>&1 || true

      - name: Install Android SDK packages
        shell: bash
        run: |
          set -euo pipefail

          sdkmanager --install \
            "platform-tools" \
            "platforms;android-${ANDROID_API}" \
            "build-tools;${BUILD_TOOLS_VERSION}" \
            "ndk;${NDK_VERSION}" \
            "cmake;${CMAKE_VERSION}"

      - name: Verify Android SDK packages
        shell: bash
        run: |
          set -euo pipefail

          sdkmanager --list_installed | sed -n '1,180p'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: ${{ env.GRADLE_VERSION }}

      - name: Generate Gradle wrapper
        shell: bash
        run: |
          set -euo pipefail

          gradle wrapper \
            --gradle-version "${GRADLE_VERSION}" \
            --distribution-type bin

      - name: Validate Gradle wrapper
        shell: bash
        run: |
          set -euo pipefail

          chmod +x ./gradlew
          test -x ./gradlew
          ./gradlew --version

      - name: Configure Git
        shell: bash
        run: |
          set -euo pipefail

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Commit Gradle wrapper changes
        shell: bash
        run: |
          set -euo pipefail

          git add \
            gradle/wrapper \
            gradlew \
            gradlew.bat

          if git diff --cached --quiet; then
            echo "No Gradle wrapper changes detected."
          else
            git commit -m "build: update Gradle wrapper to ${GRADLE_VERSION}"
          fi

      - name: Push changes
        shell: bash
        run: |
          set -euo pipefail

          git push origin HEAD:${GITHUB_REF_NAME}
