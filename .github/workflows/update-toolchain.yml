name: Update Chrona Toolchain

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: chrona-toolchain
  cancel-in-progress: false

env:
  JAVA_VERSION: "17"
  ANDROID_API: "37"
  BUILD_TOOLS_VERSION: "36.0.0"
  NDK_VERSION: "30.0.16248370"
  CMAKE_VERSION: "3.31.6"
  GRADLE_VERSION: "9.6.1"

jobs:
  update:
    name: Update Gradle and Android Toolchain
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup JDK
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}
          cache: gradle

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK
        shell: bash
        run: |
          set -euo pipefail

          yes | sdkmanager --licenses >/dev/null || true

          sdkmanager --install --channel=1             "platform-tools"             "platforms;android-${ANDROID_API}"             "build-tools;${BUILD_TOOLS_VERSION}"             "ndk;${NDK_VERSION}"             "cmake;${CMAKE_VERSION}"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: ${{ env.GRADLE_VERSION }}

      - name: Generate Gradle Wrapper
        shell: bash
        run: |
          set -euo pipefail

          gradle wrapper             --gradle-version "${GRADLE_VERSION}"             --distribution-type bin

      - name: Validate Java
        shell: bash
        run: |
          set -euo pipefail
          java -version

      - name: Validate Gradle
        shell: bash
        run: |
          set -euo pipefail
          gradle --version

      - name: Validate Gradle Wrapper
        shell: bash
        run: |
          set -euo pipefail
          chmod +x ./gradlew
          ./gradlew --version

      - name: Validate Android SDK
        shell: bash
        run: |
          set -euo pipefail

          echo "Installed Android SDK packages:"
          sdkmanager --list_installed | sed -n '1,160p'

      - name: Configure Git
        shell: bash
        run: |
          set -euo pipefail

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Commit Gradle Wrapper
        shell: bash
        run: |
          set -euo pipefail

          git add             gradle/wrapper             gradlew             gradlew.bat             2>/dev/null || true

          if git diff --cached --quiet; then
            echo "No wrapper changes detected."
          else
            git commit -m "build: update Gradle wrapper to ${GRADLE_VERSION}"
          fi

      - name: Push changes
        shell: bash
        run: |
          set -euo pipefail
          git push origin HEAD:${GITHUB_REF_NAME}
