name: Update Chrona Toolchain

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: chrona-toolchain
  cancel-in-progress: false

env:
  JAVA_VERSION: "17"
  ANDROID_API: "37"
  BUILD_TOOLS_VERSION: "36.0.0"
  NDK_VERSION: "30.0.16248370"
      CMAKE_VERSION: "3.31.6"
  GRADLE_VERSION: "9.6.1"

jobs:
  update:
    name: Update Gradle and Android Toolchain
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android SDK 37
        run: |
          sdkmanager --install \
            "platforms;android-${ANDROID_API}" \
            "build-tools;${BUILD_TOOLS_VERSION}" \
            "ndk;${NDK_VERSION}" \
            "cmake;${CMAKE_VERSION}"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: ${{ env.GRADLE_VERSION }}

      - name: Generate Gradle Wrapper
        run: |
          gradle wrapper \
            --gradle-version "${GRADLE_VERSION}" \
            --distribution-type bin

      - name: Validate toolchain
        run: |
          java -version
          gradle --version
          ./gradlew --version

      - name: Configure Git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Commit and push changes
        run: |
          git add \
            gradlew \
            gradlew.bat \
            gradle/wrapper \
            gradle.properties \
            build.gradle.kts \
            settings.gradle.kts

          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi

          git commit -m "build(ci): add Gradle Wrapper and Android SDK 37 toolchain"
          git push origin HEAD:${GITHUB_REF_NAME}
