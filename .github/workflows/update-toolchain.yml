name: Update Toolchain

on:
  workflow_dispatch:

  schedule:
    - cron: "0 3 * * 0"

permissions:
  contents: write
  pull-requests: write

jobs:
  inspect:
    name: Inspect Toolchain
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Show Environment
        run: |
          echo "Java:"
          java -version

          echo
          echo "Gradle:"
          if [ -x ./gradlew ]; then
            ./gradlew --version
          else
            echo "gradlew is not executable"
          fi

          echo
          echo "Android SDK:"
          sdkmanager --list_installed || true
