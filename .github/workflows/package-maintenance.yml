name: Package Maintenance

on:
  workflow_dispatch:
  schedule:
    - cron: '17 3 * * 1'

permissions:
  contents: write

concurrency:
  group: package-maintenance
  cancel-in-progress: false

env:
  JAVA_VERSION: '17'
  ANDROID_PLATFORM_VERSION: '37.1'
  ANDROID_BUILD_TOOLS: '37.0.0'
  ANDROID_NDK_VERSION: '28.2.13676358'
  ANDROID_CMAKE_VERSION: '3.31.6'

jobs:
  package:
    name: Sync assets, validate, build and push
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}
          cache: gradle

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android toolchain
        shell: bash
        run: |
          set -euo pipefail
          yes | sdkmanager --licenses >/dev/null 2>&1 || true
          sdkmanager --sdk_root="${ANDROID_SDK_ROOT}" --install \
            'platform-tools' \
            "platforms;android-${ANDROID_PLATFORM_VERSION}" \
            "build-tools;${ANDROID_BUILD_TOOLS}" \
            "cmake;${ANDROID_CMAKE_VERSION}" \
            "ndk;${ANDROID_NDK_VERSION}"

      - name: Install asset tools
        run: |
          sudo apt-get update
          sudo apt-get install -y git python3 unzip

      - name: Sync Material Icons, Symbols and metadata
        run: |
          ./tools/sync-material-assets.sh
          ./tools/sync-aosp-assets.sh
          ./tools/verify-upstream-assets.sh

      - name: Verify Android 17 configuration
        run: |
          chmod +x ./gradlew ./scripts/verify-android17.sh
          ./scripts/verify-android17.sh
          grep -q 'compileSdk = 37' app/build.gradle.kts
          grep -q 'targetSdk = 37' app/build.gradle.kts

      - name: Compile Kotlin
        run: ./gradlew --no-daemon --stacktrace compileDebugKotlin

      - name: Run lint
        run: ./gradlew --no-daemon --stacktrace lintDebug

      - name: Build debug APK
        run: ./gradlew --no-daemon --stacktrace assembleDebug

      - name: Commit synchronized source after successful build
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'

          git add \
            app/src/main/res \
            app/build.gradle.kts \
            third_party \
            tools \
            scripts \
            .github/workflows \
            README.md \
            CHANGELOG.md

          if git diff --cached --quiet; then
            echo 'No source or asset changes.'
            exit 0
          fi

          git commit -m 'chore(ci): sync Android 17 Material assets after successful build'

      - name: Push synchronized source
        if: success()
        run: git push origin HEAD:${GITHUB_REF_NAME}

      - name: Upload debug APK
        uses: actions/upload-artifact@v7
        with:
          name: chrona-android17-debug
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
