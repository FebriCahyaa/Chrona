name: Package Maintenance

on:
  workflow_dispatch:
  schedule:
    - cron: '17 3 * * 1'

permissions:
  contents: write

concurrency:
  group: package-maintenance
  cancel-in-progress: false

env:
  JAVA_VERSION: '17'
  ANDROID_PLATFORM_VERSION: '37'
  ANDROID_PLATFORM_MINOR: '1'
  GRADLE_VERSION: '9.7.1'
  ANDROID_BUILD_TOOLS: '37.0.0'
  ANDROID_NDK_VERSION: '28.2.13676358'
  ANDROID_CMAKE_VERSION: '3.31.6'

jobs:
  package:
    name: Sync assets, validate, build and push
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout source
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: true

      - name: Setup Java 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}
          cache: gradle

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: "platform-tools platforms;android-37 build-tools;37.0.0 cmake;3.31.6 ndk;28.2.13676358"

      - name: Setup Android CLI
        shell: bash
        run: |
          set -euo pipefail
          curl -fsSL https://dl.google.com/android/cli/latest/linux_x86_64/install.sh | bash
          export PATH="$HOME/.local/bin:$HOME/.android/bin:$PATH"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          echo "$HOME/.android/bin" >> "$GITHUB_PATH"
          command -v android
          android --version
          android update

      - name: Install Android 17 SDK toolchain
        shell: bash
        run: |
          set -euo pipefail
          android --sdk="${ANDROID_SDK_ROOT}" sdk install \
            "platform-tools" \
            "platforms/android-${ANDROID_PLATFORM_VERSION}" \
            "build-tools/${ANDROID_BUILD_TOOLS}" \
            "cmake/${ANDROID_CMAKE_VERSION}" \
            "ndk/${ANDROID_NDK_VERSION}"
      - name: Install asset tools
        run: |
          sudo apt-get update
          sudo apt-get install -y git python3 unzip

      - name: Sync Material Icons, Symbols and metadata
        shell: bash
        run: |
          set -euo pipefail
          chmod +x \
            ./tools/sync-material-assets.sh \
            ./tools/sync-aosp-assets.sh \
            ./tools/verify-upstream-assets.sh

          bash ./tools/sync-material-assets.sh
          bash ./tools/sync-aosp-assets.sh
          bash ./tools/verify-upstream-assets.sh

      - name: Refresh checked-in toolchain pins
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import os
          import re

          root = Path('.')
          gradle_version = os.environ['GRADLE_VERSION']
          wrapper = root / 'gradle/wrapper/gradle-wrapper.properties'
          text = wrapper.read_text()
          text, count = re.subn(
              r'gradle-[0-9.]+-bin\.zip',
              f'gradle-{gradle_version}-bin.zip',
              text,
              count=1,
          )
          if count != 1:
              raise SystemExit('Gradle wrapper distributionUrl not found')
          wrapper.write_text(text)

          verifier = root / 'scripts/verify-android17.sh'
          text = verifier.read_text()
          text, count = re.subn(
              r'EXPECTED_GRADLE="[0-9.]+"',
              f'EXPECTED_GRADLE="{gradle_version}"',
              text,
              count=1,
          )
          if count != 1:
              raise SystemExit('EXPECTED_GRADLE not found')
          verifier.write_text(text)
          PY
          grep -Fq "gradle-${GRADLE_VERSION}-bin.zip" gradle/wrapper/gradle-wrapper.properties
          grep -Fq "EXPECTED_GRADLE=\"${GRADLE_VERSION}\"" scripts/verify-android17.sh

      - name: Synchronize Gradle wrapper files
        shell: bash
        run: |
          set -euo pipefail
          chmod +x ./gradlew
          ./gradlew --no-daemon --stacktrace wrapper \
            --gradle-version "${GRADLE_VERSION}" \
            --distribution-type bin
          ./gradlew --version
          grep -Fq "gradle-${GRADLE_VERSION}-bin.zip" gradle/wrapper/gradle-wrapper.properties

      - name: Verify Android 17 configuration
        run: |
          chmod +x ./gradlew ./scripts/verify-android17.sh
          ./scripts/verify-android17.sh
          grep -q 'compileSdk = 37' app/build.gradle.kts
          grep -q 'targetSdk = 37' app/build.gradle.kts

      - name: Compile Kotlin
        run: ./gradlew --no-daemon --stacktrace compileDebugKotlin

      - name: Run lint
        run: ./gradlew --no-daemon --stacktrace lintDebug

      - name: Build debug APK
        run: ./gradlew --no-daemon --stacktrace assembleDebug

      - name: Commit synchronized source after successful build
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'

          git add \
            app/src/main/res \
            app/build.gradle.kts \
            third_party \
            tools \
            scripts \
            gradle/wrapper/gradle-wrapper.jar \
            gradle/wrapper/gradle-wrapper.properties \
            gradlew \
            gradlew.bat \
            .github/workflows \
            README.md \
            CHANGELOG.md \
            docs

          if git diff --cached --quiet; then
            echo 'No source or asset changes.'
            exit 0
          fi

          git commit -m 'chore(ci): sync Android 17 source and toolchain after successful build'

      - name: Push synchronized source
        if: success()
        run: git push origin HEAD:${GITHUB_REF_NAME}

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: chrona-android17-debug
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
