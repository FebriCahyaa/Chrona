name: Package Maintenance

on:
  workflow_dispatch:
  schedule:
    - cron: '17 3 * * 1'

permissions:
  contents: write

concurrency:
  group: package-maintenance
  cancel-in-progress: false

jobs:
  package:
    name: Prepare and commit package metadata
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - uses: gradle/actions/setup-gradle@v6
      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: ''
      - name: Prepare SDK packages
        run: |
          yes | sdkmanager --licenses >/dev/null 2>&1 || true
          sdkmanager --sdk_root="${ANDROID_SDK_ROOT}" --install \
            'platform-tools' \
            'platforms;android-37.0' \
            'build-tools;37.0.0' \
            'cmake;3.31.6' \
            'ndk;28.2.13676358'
      - name: Validate package files
        run: |
          chmod +x ./gradlew scripts/verify-android17.sh
          bash scripts/verify-android17.sh
          ./gradlew --no-daemon --stacktrace tasks
          test -f gradle/wrapper/gradle-wrapper.properties
          if [ -f gradle/libs.versions.toml ]; then echo 'Version catalog present'; fi
      - name: Commit generated package metadata if changed
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          # Only stage paths that actually exist in the repository.
          git add gradle .github
          if [ -f docs/build/BUILD_ENVIRONMENT.md ]; then
            git add docs/build/BUILD_ENVIRONMENT.md
          fi
          if [ -f docs/build/sdkmanager-list.txt ]; then
            git add docs/build/sdkmanager-list.txt
          fi

          if git diff --cached --quiet; then
            echo 'No package metadata changes.'
            exit 0
          fi
          git commit -m 'chore(ci): refresh Android build packages'
          git push origin HEAD:${GITHUB_REF_NAME}
