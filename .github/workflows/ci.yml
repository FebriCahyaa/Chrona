#
# Pipeline (AES — Analyze → Execute → Ship):
#
#   analyze ──► verify (matrix: Unit tests | Lint) ──► debug-build ──► ci-status
#
name: Chrona CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: chrona-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ── Stage 1 · Analyze ──────────────────────────────────────────────────
  analyze:
    name: AES / Analyze
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1
      - name: Setup Python
        uses: actions/setup-python@v7.0.0
        with:
          python-version: '3.13'
      - name: Repository audit
        run: bash scripts/audit/source-audit.sh
      - name: Telegram renderer tests
        run: python3 -m unittest scripts/telegram/test_notify.py

  # ── Stage 2 · Execute (matrix) ─────────────────────────────────────────
  # Both legs run in parallel and are rendered as one "Matrix: verify" group.
  # The job names ("AES / Unit tests", "AES / Lint") are unchanged so existing
  # branch-protection status checks keep matching.
  verify:
    name: AES / ${{ matrix.name }}
    needs: analyze
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Unit tests
            task: testDebugUnitTest
            artifact: chrona-unit-test-report
            report: app/build/test-results/testDebugUnitTest/**
          - name: Lint
            task: lintDebug
            artifact: chrona-lint
            report: app/build/reports/lint-results-debug.*
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: ./.github/actions/setup-android
        with:
          install-native: 'false'
      - name: ${{ matrix.name }}
        run: ./gradlew --no-daemon --stacktrace ${{ matrix.task }}
      - name: Upload ${{ matrix.name }} report
        if: always()
        uses: actions/upload-artifact@v7.0.1
        with:
          name: ${{ matrix.artifact }}-${{ github.sha }}
          path: ${{ matrix.report }}
          if-no-files-found: warn
          retention-days: 14

  # ── Stage 3 · Execute (build) ──────────────────────────────────────────
  debug-build:
    name: AES / Debug APK
    needs: verify
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: ./.github/actions/setup-android
      - name: Build debug APK
        run: ./gradlew --no-daemon --stacktrace assembleDebug
      - name: Upload debug APK
        uses: actions/upload-artifact@v7.0.1
        with:
          name: chrona-debug-${{ github.sha }}
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14

  # ── Stage 4 · Gate ─────────────────────────────────────────────────────
  # Single aggregate result for the whole pipeline. Use "AES / CI status" as
  # the one required check in branch protection if desired.
  ci-status:
    name: AES / CI status
    if: ${{ always() }}
    needs:
      - analyze
      - verify
      - debug-build
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Summarize pipeline
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: |
          python3 - <<'PY'
          import json
          import os
          import sys

          needs = json.loads(os.environ["NEEDS"])
          icons = {"success": "✅", "skipped": "⏭️"}
          lines = ["## Chrona CI pipeline", "", "| Stage | Result |", "| --- | --- |"]
          for job, data in needs.items():
              result = data["result"]
              lines.append(f"| `{job}` | {icons.get(result, '❌')} {result} |")
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a", encoding="utf-8") as summary:
              summary.write("\n".join(lines) + "\n")

          failed = [job for job, data in needs.items() if data["result"] != "success"]
          if failed:
              print(f"::error::Pipeline stages did not succeed: {', '.join(failed)}")
              sys.exit(1)
          PY
