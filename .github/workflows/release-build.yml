#
# Release packaging is deliberately manual. A tag alone never builds or
# publishes binaries.
name: Chrona Release Build

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag (for example v0.5.1)
        required: true
        type: string
      prerelease:
        description: Publish as a pre-release
        required: true
        default: false
        type: boolean
      publish:
        description: Publish the generated APK/AAB to GitHub Releases
        required: true
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: chrona-release-${{ inputs.tag }}
  cancel-in-progress: false

jobs:
  validate:
    name: Release / Validate identity
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
          ref: ${{ inputs.tag }}

      - name: Verify release identity
        run: ./scripts/release/verify-release.sh "${{ inputs.tag }}"

      - name: Repository contract audit
        run: bash scripts/audit/source-audit.sh

  verify:
    name: Release / Test + Lint
    needs: validate
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: ${{ inputs.tag }}

      - uses: ./.github/actions/setup-android
        with:
          install-native: 'true'

      - name: Unit tests
        run: ./gradlew --no-daemon --stacktrace testOssDebugUnitTest

      - name: Lint
        run: ./gradlew --no-daemon --stacktrace lintOssDebug

      - name: Debug native smoke build
        run: ./gradlew --no-daemon --stacktrace assembleOssDebug -PchronaTargetAbi=arm64-v8a

  build:
    name: Release / Build signed artifacts
    needs: verify
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    environment: release
    env:
      RELEASE_TAG: ${{ inputs.tag }}
      CHRONA_KEYSTORE_BASE64: ${{ secrets.CHRONA_KEYSTORE_BASE64 }}
      CHRONA_KEYSTORE_PASSWORD: ${{ secrets.CHRONA_KEYSTORE_PASSWORD }}
      CHRONA_KEY_ALIAS: ${{ secrets.CHRONA_KEY_ALIAS }}
      CHRONA_KEY_PASSWORD: ${{ secrets.CHRONA_KEY_PASSWORD }}
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
          ref: ${{ inputs.tag }}

      - uses: ./.github/actions/setup-android
        with:
          install-native: 'true'

      - name: Restore signing keystore
        shell: bash
        run: |
          set -euo pipefail
          test -n "$CHRONA_KEYSTORE_BASE64"
          mkdir -p "$RUNNER_TEMP/chrona-signing"
          printf '%s' "$CHRONA_KEYSTORE_BASE64" | base64 --decode \
            > "$RUNNER_TEMP/chrona-signing/chrona-release.jks"
          chmod 600 "$RUNNER_TEMP/chrona-signing/chrona-release.jks"
          echo "CHRONA_KEYSTORE_PATH=$RUNNER_TEMP/chrona-signing/chrona-release.jks" >> "$GITHUB_ENV"

      - name: Build APK + AAB
        run: ./gradlew --no-daemon --stacktrace assemblePlayRelease bundlePlayRelease

      - name: Collect release files
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p release
          cp app/build/outputs/apk/play/release/*.apk release/
          cp app/build/outputs/bundle/play/release/*.aab release/
          if compgen -G 'app/build/outputs/mapping/playRelease/*' > /dev/null; then
            mkdir -p release/mapping
            cp app/build/outputs/mapping/playRelease/* release/mapping/
          fi
          sha256sum release/*.apk release/*.aab > release/SHA256SUMS

      - name: Verify APK signatures
        shell: bash
        run: |
          set -euo pipefail
          APKSIGNER="$ANDROID_SDK_ROOT/build-tools/37.0.0/apksigner"
          for apk in release/*.apk; do
            "$APKSIGNER" verify --verbose "$apk"
            "$APKSIGNER" verify --print-certs "$apk"
          done

      - name: Upload release build
        uses: actions/upload-artifact@v7.0.1
        with:
          name: chrona-release-${{ inputs.tag }}
          path: release/
          if-no-files-found: error
          retention-days: 30

      - name: Remove signing material
        if: always()
        shell: bash
        run: |
          set +e
          rm -rf "$RUNNER_TEMP/chrona-signing"

  attest:
    name: Release / Provenance
    needs: build
    if: ${{ needs.build.result == 'success' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write
      attestations: write
      artifact-metadata: write
    steps:
      - uses: actions/download-artifact@v8.0.1
        with:
          name: chrona-release-${{ inputs.tag }}
          path: release

      - uses: actions/attest@v4.2.2
        with:
          subject-path: |
            ${{ github.workspace }}/release/*.apk
            ${{ github.workspace }}/release/*.aab

  publish:
    name: Release / GitHub Release
    if: ${{ inputs.publish && needs.build.result == 'success' }}
    needs: [build, attest]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8.0.1
        with:
          name: chrona-release-${{ inputs.tag }}
          path: release

      - name: Publish release
        id: release
        uses: softprops/action-gh-release@v3.0.3
        with:
          tag_name: ${{ inputs.tag }}
          name: Chrona ${{ inputs.tag }}
          prerelease: ${{ inputs.prerelease }}
          generate_release_notes: true
          files: |
            release/*.apk
            release/*.aab
            release/SHA256SUMS

      - name: Release summary
        run: |
          echo "Release: ${{ steps.release.outputs.url }}" >> "$GITHUB_STEP_SUMMARY"

  telegram:
    name: Release / Telegram
    if: ${{ inputs.publish }}
    needs: publish
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
          ref: ${{ inputs.tag }}

      - uses: actions/setup-python@v6.1.0
        with:
          python-version: '3.13'

      - name: Send release notification
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.CHRONABOT_RELEASE_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.CHRONABOT_RELEASE_CHAT_ID }}
          GITHUB_TOKEN: ${{ github.token }}
          CHRONA_RELEASE_TAG: ${{ inputs.tag }}
          CHRONA_RELEASE_URL: https://github.com/${{ github.repository }}/releases/tag/${{ inputs.tag }}
          CHRONA_RELEASE_PRERELEASE: ${{ inputs.prerelease }}
        run: |
          if [[ -z "${TELEGRAM_BOT_TOKEN:-}" || -z "${TELEGRAM_CHAT_ID:-}" ]]; then
            echo "Telegram credentials are not configured; notification skipped."
            exit 0
          fi
          export CHRONA_RELEASE_SHA="$(git rev-list -n1 "${CHRONA_RELEASE_TAG}")"
          python3 scripts/telegram/notify.py --kind release
