name: Chrona Localization

on:
  push:
    branches: [main]
    paths:
      - app/src/main/res/values/strings.xml
      - crowdin.yml
  schedule:
    - cron: '13 5 * * 2'
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: chrona-localization
  cancel-in-progress: true

jobs:
  sync:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: crowdin/github-action@v3
        with:
          upload_sources: true
          upload_translations: false
          download_translations: true
          localization_branch_name: l10n-crowdin
          create_pull_request: true
          pull_request_title: 'chore(l10n): synchronize translations'
          pull_request_body: |
            Automated localization update from Crowdin.

            Please review resource changes before merging.
          pull_request_base_branch_name: main
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CROWDIN_PROJECT_ID: ${{ secrets.CROWDIN_PROJECT_ID }}
          CROWDIN_PERSONAL_TOKEN: ${{ secrets.CROWDIN_PERSONAL_TOKEN }}
