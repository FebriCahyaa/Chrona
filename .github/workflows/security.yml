name: Chrona Security

on:
  pull_request:
  push:
    branches:
      - main
  schedule:
    - cron: '40 2 * * 1'
  workflow_dispatch:

permissions:
  contents: read
  security-events: write
  actions: read

jobs:
  codeql:
    name: CodeQL
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Set up Java
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: java-kotlin
          config-file: ./.github/codeql/codeql-config.yml
      - name: Set up Android SDK tools
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools'

      - name: Install Android 17 SDK 37.2 and Build Tools 37.1.0
        shell: bash
        run: |
          set -euo pipefail
          sdkmanager --install \
            'platforms;android-37.2' \
            'build-tools;37.1.0'

      - name: Verify Android SDK platform and build tools
        run: python3 scripts/ci/verify_android_sdk.py
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: wrapper
      - name: Build
        run: ./gradlew --no-daemon assembleDebug
      - name: Analyze
        uses: github/codeql-action/analyze@v4

  dependency-review:
    name: Dependency Review
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      pull-requests: read
    steps:
      - name: Dependency review
        uses: actions/dependency-review-action@v5
        with:
          fail-on-severity: high

  dependency-submission:
    name: Dependency Graph
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Set up Java
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Android SDK tools
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools'

      - name: Install Android 17 SDK 37.2 and Build Tools 37.1.0
        shell: bash
        run: |
          set -euo pipefail
          sdkmanager --install \
            'platforms;android-37.2' \
            'build-tools;37.1.0'

      - name: Verify Android SDK platform and build tools
        run: python3 scripts/ci/verify_android_sdk.py
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: wrapper
      - name: Submit dependency graph
        uses: gradle/actions/dependency-submission@v6

  telegram:
    name: Telegram Security
    needs:
      - codeql
      - dependency-review
      - dependency-submission
    if: always() && (github.event_name != 'pull_request' || github.actor != 'dependabot[bot]')
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Send security report
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.CHRONABOT_CI_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.CHRONABOT_CI_CHAT_ID }}
          TELEGRAM_EVENT: security
          CODEQL_RESULT: ${{ needs.codeql.result }}
          DEPENDENCY_REVIEW_RESULT: ${{ needs.dependency-review.result }}
          DEPENDENCY_SUBMISSION_RESULT: ${{ needs.dependency-submission.result }}
          GITHUB_EVENT_NAME: ${{ github.event_name }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_SERVER_URL: ${{ github.server_url }}
          GITHUB_RUN_ID: ${{ github.run_id }}
          GITHUB_RUN_ATTEMPT: ${{ github.run_attempt }}
          GITHUB_SHA: ${{ github.sha }}
          GITHUB_ACTOR: ${{ github.actor }}
          GITHUB_WORKFLOW: ${{ github.workflow }}
        run: python3 scripts/telegram/notify.py
        continue-on-error: true
