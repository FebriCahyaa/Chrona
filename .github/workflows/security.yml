#
# Pipeline:
#
#   license-audit ──► codeql ──┐
#   dependency-review (PR) ────┼──► security-status
#   scorecard (push/cron) ─────┘
#
# Cheap policy checks run first so the expensive CodeQL build is skipped when
# the license inventory already fails.
name: Chrona Security

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: '41 4 * * 1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  dependency-review:
    if: github.event_name == 'pull_request'
    name: Dependency review
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/dependency-review-action@v5
        with:
          config-file: ./.github/dependency-review-config.yml

  license-audit:
    name: License inventory audit
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-python@v7.0.0
        with:
          python-version: '3.13'
      - run: python3 scripts/audit/license-audit.py

  codeql:
    name: CodeQL / Kotlin + C++
    needs: license-audit
    runs-on: ubuntu-24.04
    permissions:
      actions: read
      contents: read
      security-events: write
      packages: read
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: ./.github/actions/setup-android
      - uses: github/codeql-action/init@v4.38.0
        with:
          languages: java-kotlin, cpp
          build-mode: manual
          config-file: ./.github/codeql-config.yml
      - name: Build for CodeQL
        run: ./gradlew --no-daemon --stacktrace assembleDebug
      - uses: github/codeql-action/analyze@v4.38.0
        with:
          category: /language:java-kotlin-cpp

  scorecard:
    if: github.event_name == 'push' || github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    name: OpenSSF Scorecard
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      security-events: write
      id-token: write
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - name: Run Scorecard
        uses: ossf/scorecard-action@v2.4.4
        with:
          results_file: scorecard-results.sarif
          results_format: sarif
          publish_results: true
      - name: Upload Scorecard results
        uses: github/codeql-action/upload-sarif@v4.38.0
        with:
          sarif_file: scorecard-results.sarif

  # Aggregate result. Jobs that are intentionally skipped for the current event
  # (dependency-review outside PRs, scorecard on PRs) do not fail the gate.
  security-status:
    name: Security status
    if: ${{ always() }}
    needs:
      - license-audit
      - dependency-review
      - codeql
      - scorecard
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Summarize security checks
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: |
          python3 - <<'PY'
          import json
          import os
          import sys

          needs = json.loads(os.environ["NEEDS"])
          icons = {"success": "✅", "skipped": "⏭️"}
          lines = ["## Chrona security checks", "", "| Check | Result |", "| --- | --- |"]
          for job, data in needs.items():
              result = data["result"]
              lines.append(f"| `{job}` | {icons.get(result, '❌')} {result} |")
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a", encoding="utf-8") as summary:
              summary.write("\n".join(lines) + "\n")

          failed = [job for job, data in needs.items() if data["result"] in ("failure", "cancelled")]
          if failed:
              print(f"::error::Security checks did not succeed: {', '.join(failed)}")
              sys.exit(1)
          PY
