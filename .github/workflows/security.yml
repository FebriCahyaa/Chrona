name: Chrona Security

on:
  pull_request:
  push:
    branches:
      - main
      - dev
      - canary
      - stable
  schedule:
    - cron: '40 2 * * 1'
  workflow_dispatch:

permissions:
  contents: read
  security-events: write
  actions: read

jobs:
  codeql:
    name: CodeQL
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: java-kotlin
          config-file: ./.github/codeql/codeql-config.yml
      - name: Android toolchain
        uses: ./.github/actions/android-toolchain
        with:
          sdk-channel: 0
      - name: Build
        run: ./gradlew --no-daemon --stacktrace assembleDebug
      - name: Analyze
        uses: github/codeql-action/analyze@v4

  trufflehog:
    name: TruffleHog secret scan
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Scan for verified secrets
        uses: trufflesecurity/trufflehog@v3.97.8
        with:
          # On push/PR TruffleHog scans only the new commits; scheduled and
          # manual runs scan the full history.
          extra_args: --results=verified,unknown

  dependency-review:
    name: Dependency Review
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      pull-requests: read
    steps:
      - name: Dependency review
        uses: actions/dependency-review-action@v5
        with:
          fail-on-severity: high

  dependency-submission:
    name: Dependency Graph
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Android toolchain
        uses: ./.github/actions/android-toolchain
        with:
          sdk-channel: 0
      - name: Submit dependency graph
        uses: gradle/actions/dependency-submission@v6

  telegram:
    name: Telegram Security
    needs:
      - codeql
      - trufflehog
      - dependency-review
      - dependency-submission
    if: always() && (github.event_name != 'pull_request' || github.actor != 'dependabot[bot]')
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Send security report
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.CHRONABOT_CI_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.CHRONABOT_CI_CHAT_ID }}
          TELEGRAM_EVENT: security
          CODEQL_RESULT: ${{ needs.codeql.result }}
          TRUFFLEHOG_RESULT: ${{ needs.trufflehog.result }}
          DEPENDENCY_REVIEW_RESULT: ${{ needs.dependency-review.result }}
          DEPENDENCY_SUBMISSION_RESULT: ${{ needs.dependency-submission.result }}
        run: python3 scripts/telegram/notify.py
        continue-on-error: true
