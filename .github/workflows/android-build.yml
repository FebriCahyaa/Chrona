name: Chrona Android Build

on:
  workflow_dispatch:

  push:
    branches:
      - main

  pull_request:
    branches:
      - main

permissions:
  contents: write

concurrency:
  group: chrona-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build Chrona
    runs-on: ubuntu-24.04

    env:
      JAVA_VERSION: "17"
      GRADLE_VERSION: "9.6.1"
      ANDROID_API_LEVEL: "36"
      ANDROID_BUILD_TOOLS: "36.0.0"
      ANDROID_NDK_VERSION: "28.2.13676358"

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}
          cache: gradle

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: ${{ env.GRADLE_VERSION }}

      - name: Verify Java and Gradle
        run: |
          set -euxo pipefail
          java -version
          gradle --version

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: platform-tools

      - name: Accept Android SDK licenses
        run: |
          set -euo pipefail
          yes | sdkmanager --licenses >/dev/null 2>&1 || true

      - name: Show available SDK packages
        run: |
          set -euo pipefail

          sdkmanager --list > sdkmanager-list.txt

          grep -E \
            'platforms;android-|build-tools;|ndk;' \
            sdkmanager-list.txt | sed -n '1,150p'

      - name: Install Android SDK
        run: |
          set -euxo pipefail

          sdkmanager --install \
            "platform-tools" \
            "platforms;android-${ANDROID_API_LEVEL}" \
            "build-tools;${ANDROID_BUILD_TOOLS}" \
            "ndk;${ANDROID_NDK_VERSION}"

      - name: Verify Android SDK
        run: |
          set -euxo pipefail

          echo "ANDROID_HOME=$ANDROID_HOME"
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT"

          echo "SDK:"
          sdkmanager --version

          echo "ADB:"
          adb version

          echo "Platform:"
          test -d "$ANDROID_SDK_ROOT/platforms/android-${ANDROID_API_LEVEL}"

          echo "Build Tools:"
          test -d "$ANDROID_SDK_ROOT/build-tools/${ANDROID_BUILD_TOOLS}"

          echo "NDK:"
          test -d "$ANDROID_SDK_ROOT/ndk/${ANDROID_NDK_VERSION}"

      - name: Inspect project
        run: |
          set -euxo pipefail

          echo "===== ROOT ====="
          ls -lah

          echo "===== GRADLE PROJECT ====="
          find . -maxdepth 3 \
            \( \
              -name "settings.gradle" \
              -o -name "settings.gradle.kts" \
              -o -name "build.gradle" \
              -o -name "build.gradle.kts" \
              -o -name "gradle.properties" \
            \) \
            -print

      - name: Validate project
        run: |
          set -euxo pipefail
          gradle tasks --stacktrace --no-daemon --warning-mode all

      - name: Build Debug APK
        run: |
          set -euxo pipefail
          gradle assembleDebug \
            --stacktrace \
            --no-daemon \
            --warning-mode all

      - name: Find APK
        run: |
          set -euxo pipefail

          find . \
            -type f \
            -path "*/build/outputs/apk/*" \
            -name "*.apk" \
            -print

      - name: Upload APK
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: chrona-debug-apk
          path: |
            **/build/outputs/apk/**/*.apk
          if-no-files-found: warn
          retention-days: 14

      - name: Detect generated changes
        id: changes
        run: |
          if [ -n "$(git status --porcelain)" ]; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Commit generated changes
        if: |
          github.event_name == 'push' &&
          steps.changes.outputs.changed == 'true'
        run: |
          set -euxo pipefail

          git config user.name "github-actions[bot]"
          git config user.email \
            "41898282+github-actions[bot]@users.noreply.github.com"

          git add -A

          git commit \
            -m "ci: update generated build files" \
            || true

      - name: Push generated changes
        if: |
          github.event_name == 'push' &&
          steps.changes.outputs.changed == 'true'
        run: |
          set -euxo pipefail
          git push origin HEAD:${GITHUB_REF_NAME}
