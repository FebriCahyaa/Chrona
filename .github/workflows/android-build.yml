name: Chrona Android Build

on:
  workflow_dispatch:

  push:
    branches:
      - main

  pull_request:
    branches:
      - main

permissions:
  contents: write

concurrency:
  group: chrona-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build Chrona
    runs-on: ubuntu-24.04

    env:
      JAVA_VERSION: "17"
      GRADLE_VERSION: "9.6.1"
      ANDROID_API_LEVEL: "37"
      ANDROID_BUILD_TOOLS: "36.0.0"
      ANDROID_NDK_VERSION: "28.2.13676358"

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}
          cache: gradle

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: ${{ env.GRADLE_VERSION }}

      - name: Verify Java and Gradle
        shell: bash
        run: |
          set -euxo pipefail

          echo "===== JAVA ====="
          java -version

          echo "===== GRADLE ====="
          gradle --version

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: ''

      - name: Configure SDK licenses
        shell: bash
        run: |
          set -euxo pipefail

          yes | sdkmanager --licenses >/dev/null || true

      - name: Install Android SDK
        shell: bash
        run: |
          set -euxo pipefail

          sdkmanager \
            "platform-tools" \
            "platforms;android-${ANDROID_API_LEVEL}" \
            "build-tools;${ANDROID_BUILD_TOOLS}" \
            "ndk;${ANDROID_NDK_VERSION}"

      - name: Verify Android SDK
        shell: bash
        run: |
          set -euxo pipefail

          echo "===== SDK MANAGER ====="
          sdkmanager --version

          echo
          echo "===== INSTALLED PACKAGES ====="
          sdkmanager --list_installed | sed -n '1,180p'

          echo
          echo "===== ADB ====="
          adb version

          echo
          echo "===== BUILD TOOLS ====="
          test -x \
            "$ANDROID_HOME/build-tools/${ANDROID_BUILD_TOOLS}/aapt2"

          echo
          echo "===== NDK ====="
          test -d \
            "$ANDROID_HOME/ndk/${ANDROID_NDK_VERSION}"

      - name: Inspect project
        shell: bash
        run: |
          set -euxo pipefail

          echo "===== ROOT ====="
          ls -lah

          echo
          echo "===== GRADLE CONFIGURATION ====="

          find . -maxdepth 3 \
            \( \
              -name "settings.gradle" \
              -o -name "settings.gradle.kts" \
              -o -name "build.gradle" \
              -o -name "build.gradle.kts" \
              -o -name "gradle.properties" \
            \) \
            -print

      - name: Validate Gradle project
        shell: bash
        run: |
          set -euxo pipefail

          gradle \
            tasks \
            --stacktrace \
            --no-daemon \
            --warning-mode all

      - name: Build Debug APK
        shell: bash
        run: |
          set -euxo pipefail

          gradle \
            assembleDebug \
            --stacktrace \
            --no-daemon \
            --warning-mode all

      - name: Locate APK
        shell: bash
        run: |
          set -euxo pipefail

          echo "===== APK ====="

          find . \
            -type f \
            -path "*/build/outputs/apk/*" \
            -name "*.apk" \
            -print

      - name: Upload APK
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: chrona-debug-apk
          path: |
            **/build/outputs/apk/**/*.apk
          if-no-files-found: warn
          retention-days: 14

      - name: Detect generated changes
        id: changes
        shell: bash
        run: |
          if [ -n "$(git status --porcelain)" ]; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Commit generated changes
        if: |
          github.event_name == 'push' &&
          steps.changes.outputs.changed == 'true'
        shell: bash
        run: |
          set -euxo pipefail

          git config user.name "github-actions[bot]"
          git config user.email \
            "41898282+github-actions[bot]@users.noreply.github.com"

          git add -A

          git commit \
            -m "ci: update generated build files" \
            || true

      - name: Push generated changes
        if: |
          github.event_name == 'push' &&
          steps.changes.outputs.changed == 'true'
        shell: bash
        run: |
          set -euxo pipefail

          git push origin HEAD:${GITHUB_REF_NAME}
