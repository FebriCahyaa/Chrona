name: Release Drafter

on:
  push:
    branches:
      - stable
  pull_request_target:
    types: [opened, reopened, synchronize, edited]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  draft:
    name: Update release draft
    if: github.event_name != 'pull_request_target'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: write
      pull-requests: read
    steps:
      - name: Draft next stable release
        uses: release-drafter/release-drafter@v7
        with:
          commitish: stable

  autolabel:
    name: Autolabel pull request
    if: github.event_name == 'pull_request_target'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: Label from conventional title
        uses: release-drafter/release-drafter/autolabeler@v7
