name: CLOCK APP CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: clock-app-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Verify project
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout source
        uses: actions/checkout@v7

      - name: Fix Gradle wrapper permissions
        shell: bash
        run: |
          set -euo pipefail
          chmod +x ./gradlew
          test -x ./gradlew
          ls -l ./gradlew

      - name: Verify required files
        shell: bash
        run: |
          set -euo pipefail
          test -f settings.gradle.kts
          test -f build.gradle.kts
          test -f app/build.gradle.kts
          test -f app/src/main/AndroidManifest.xml
          test -f app/src/main/java/com/febricahyaa/clockapp/MainActivity.kt
          echo "Project structure OK."

  build:
    name: Build debug APK
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout source
        uses: actions/checkout@v7

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools'


      - name: Install Android SDK 37
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager --install --channel=1 \
            "platform-tools" \
            "platforms;android-37.0" \
            "build-tools;36.0.0" \
            "cmake;3.31.6" \
            "ndk;30.0.16248370"
          yes | sdkmanager --licenses > /dev/null || true

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '9.6.1'

      - name: Build APK
        run: ./gradlew --no-daemon --stacktrace --build-cache assembleDebug

      - name: Upload APK artifact
        uses: actions/upload-artifact@v7
        with:
          name: clock-app-debug-${{ github.run_number }}
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
