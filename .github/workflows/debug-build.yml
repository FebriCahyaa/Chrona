#
# Debug validation and multi-ABI packaging. APK artifacts are optional and
# only uploaded when a maintainer explicitly dispatches this workflow.
name: Chrona Debug Build

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      upload_artifact:
        description: Upload debug APK artifacts
        required: true
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: chrona-debug-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validation:
    name: Debug / Unit + Lint
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7.0.1

      - uses: ./.github/actions/setup-android
        with:
          install-native: 'false'

      - name: Unit tests
        run: ./gradlew --no-daemon --stacktrace testOssDebugUnitTest

      - name: Lint
        run: ./gradlew --no-daemon --stacktrace lintOssDebug

  instrumented-test:
    name: Debug / Instrumented Compose + Espresso
    needs: validation
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v7.0.1

      - uses: ./.github/actions/setup-android
        with:
          install-native: 'true'

      - name: Enable KVM for Android Emulator
        shell: bash
        run: |
          set -euo pipefail
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          if [[ -e /dev/kvm ]]; then
            sudo chmod 0666 /dev/kvm
            ls -l /dev/kvm
          else
            echo 'WARNING: /dev/kvm is unavailable; emulator will use software acceleration.'
          fi

      - name: Run Android instrumentation tests
        uses: reactivecircus/android-emulator-runner@v2.38.0
        with:
          # The runner action installs its platform from `api-level`.
          # Use the Android 17 base platform for the emulator; the app itself
          # compiles against the separate 37.1 minor SDK in setup-android.
          api-level: '37.0'
          system-image-api-level: '37.0'
          target: google_apis
          arch: x86_64
          profile: pixel_2
          cores: 4
          ram-size: 4096M
          heap-size: 512M
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim -camera-back none -camera-front none -no-metrics
          disable-animations: true
          emulator-boot-timeout: 900
          disable-linux-hw-accel: auto
          script: ./gradlew --no-daemon --stacktrace connectedOssDebugAndroidTest

  apk:
    name: Debug / ${{ matrix.abi }}
    needs: validation
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        abi: [arm64-v8a, armeabi-v7a, x86, x86_64]
    steps:
      - uses: actions/checkout@v7.0.1

      - uses: ./.github/actions/setup-android
        with:
          install-native: 'true'

      - name: Build debug APK
        run: ./gradlew --no-daemon --stacktrace assembleOssDebug -PchronaTargetAbi=${{ matrix.abi }}

      - name: Upload APK artifact
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.upload_artifact }}
        uses: actions/upload-artifact@v7.0.1
        with:
          name: chrona-debug-${{ matrix.abi }}-${{ github.sha }}
          path: app/build/outputs/apk/oss/debug/*.apk
          if-no-files-found: error
          retention-days: 14
