#
# Debug validation and multi-ABI packaging. APK artifacts are optional and
# only uploaded when a maintainer explicitly dispatches this workflow.
name: Chrona Debug Build

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      upload_artifact:
        description: Upload debug APK artifacts
        required: true
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: chrona-debug-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validation:
    name: Debug / Unit + Lint
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7.0.1

      - uses: ./.github/actions/setup-android
        with:
          install-native: 'false'

      - name: Unit tests
        run: ./gradlew --no-daemon --stacktrace testOssDebugUnitTest

      - name: Lint
        run: ./gradlew --no-daemon --stacktrace lintOssDebug

  instrumented-test:
    name: Debug / Instrumented Compose + Espresso
    needs: validation
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    env:
      ANDROID_AVD_HOME: ${{ runner.temp }}/chrona-avd
    steps:
      - uses: actions/checkout@v7.0.1

      - uses: ./.github/actions/setup-android
        with:
          install-native: 'true'

      - name: Enable KVM for Android Emulator
        shell: bash
        run: |
          set -euo pipefail
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          if [[ -e /dev/kvm ]]; then
            sudo chmod 0666 /dev/kvm
            ls -l /dev/kvm
          else
            echo 'WARNING: /dev/kvm is unavailable; emulator will use software acceleration.'
          fi

      - name: Install instrumentation emulator packages
        shell: bash
        run: |
          set -euo pipefail

          SDKMANAGER="$(command -v sdkmanager || true)"
          if [[ -z "${SDKMANAGER}" || ! -x "${SDKMANAGER}" ]]; then
            echo 'ERROR: sdkmanager is not available on PATH.'
            exit 1
          fi

          SDKMANAGER_VERSION="$(${SDKMANAGER} --version | head -n 1)"
          VERSION_OK="$(printf '%s\n' '20.0' "${SDKMANAGER_VERSION}" | sort -V | head -n 1)"
          if [[ "${VERSION_OK}" != '20.0' ]]; then
            echo "ERROR: sdkmanager ${SDKMANAGER_VERSION} is too old for Android 37 minor-version metadata."
            echo "Resolved sdkmanager: ${SDKMANAGER}"
            exit 1
          fi

          echo "Using sdkmanager ${SDKMANAGER_VERSION}: ${SDKMANAGER}"
          # Keep the repository compile/target platform at Android 17.1 while using
          # the Android 17.0 16 KB page-size system image proven in CI.
          "${SDKMANAGER}" --sdk_root="${ANDROID_SDK_ROOT}" \
            'platforms;android-37.1' \
            'platform-tools' \
            'emulator' \
            'system-images;android-37.0;google_apis_ps16k;x86_64'

      - name: Install Android Emulator host dependencies
        shell: bash
        run: |
          set -euo pipefail
          # The Android Emulator QEMU binary links against PulseAudio even when
          # the emulator is launched with -noaudio. Ubuntu 24.04 runners may
          # not have the PulseAudio client library installed by default.
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libpulse0

      - name: Verify Pixel 6 AVD profile
        shell: bash
        run: |
          set -euo pipefail

          EMULATOR="${ANDROID_SDK_ROOT}/emulator/emulator"
          AVDMANAGER="$(command -v avdmanager || true)"

          if [[ ! -x "${EMULATOR}" ]]; then
            echo "ERROR: Android Emulator binary was not installed at ${EMULATOR}"
            ls -la "${ANDROID_SDK_ROOT}/emulator" || true
            exit 1
          fi
          if [[ -z "${AVDMANAGER}" || ! -x "${AVDMANAGER}" ]]; then
            echo 'ERROR: avdmanager is not available on PATH.'
            command -v avdmanager || true
            exit 1
          fi

          AVDMANAGER_VERSION="$(${AVDMANAGER} --version | head -n 1)"
          VERSION_OK="$(printf '%s\n' '20.0' "${AVDMANAGER_VERSION}" | sort -V | head -n 1)"
          if [[ "${VERSION_OK}" != '20.0' ]]; then
            echo "ERROR: avdmanager ${AVDMANAGER_VERSION} is too old for Android 37 minor-version system images."
            echo "Resolved avdmanager: ${AVDMANAGER}"
            echo 'PATH entries containing cmdline-tools:'
            tr ':' '\n' <<< "${PATH}" | grep 'cmdline-tools' || true
            exit 1
          fi

          echo 'Installed Android Emulator:'
          "${EMULATOR}" -version | sed -n '1,3p'
          echo "Using avdmanager ${AVDMANAGER_VERSION}: ${AVDMANAGER}"
          echo 'Resolved Android command-line tools:'
          type -a sdkmanager avdmanager || true

          echo 'Available Pixel device profiles:'
          set +e
          DEVICE_LIST="$(${AVDMANAGER} list device 2>&1)"
          DEVICE_STATUS=$?
          set -e
          printf '%s\n' "${DEVICE_LIST}"
          if [[ ${DEVICE_STATUS} -ne 0 ]]; then
            echo "ERROR: avdmanager list device failed with exit code ${DEVICE_STATUS}."
            exit "${DEVICE_STATUS}"
          fi

          # Pixel 6 is used because it is a known-good hardware profile for Android 37.0
          # system-image provisioning on GitHub-hosted Ubuntu runners.
          if ! grep -qE '(^id: .*"pixel_6"|^[[:space:]]*Name: Pixel 6$)' <<< "${DEVICE_LIST}"; then
            echo 'ERROR: Pixel 6 hardware profile is not available in the installed command-line tools.'
            echo 'Available Pixel profiles:'
            grep -E '(^id: .*"pixel_|^[[:space:]]*Name: Pixel )' <<< "${DEVICE_LIST}" || true
            exit 1
          fi

          echo 'Pixel 6 profile: available'

      - name: Create instrumentation AVD
        shell: bash
        run: |
          set -euo pipefail

          AVDMANAGER="$(command -v avdmanager || true)"
          if [[ -z "${AVDMANAGER}" || ! -x "${AVDMANAGER}" ]]; then
            echo 'ERROR: avdmanager is not available on PATH.'
            exit 1
          fi

          AVD_ROOT="${ANDROID_AVD_HOME:-$HOME/.android/avd}"
          mkdir -p "${AVD_ROOT}"

          AVDMANAGER_VERSION="$(${AVDMANAGER} --version | head -n 1)"
          VERSION_OK="$(printf '%s\n' '20.0' "${AVDMANAGER_VERSION}" | sort -V | head -n 1)"
          if [[ "${VERSION_OK}" != '20.0' ]]; then
            echo "ERROR: avdmanager ${AVDMANAGER_VERSION} is too old for Android 37 minor-version system images."
            echo "Resolved avdmanager: ${AVDMANAGER}"
            exit 1
          fi

          SYSTEM_IMAGE="${ANDROID_SDK_ROOT}/system-images/android-37.0/google_apis_ps16k/x86_64"
          if [[ ! -d "${SYSTEM_IMAGE}" ]]; then
            echo "ERROR: Android 37.0 system image is missing at ${SYSTEM_IMAGE}"
            exit 1
          fi

          echo no | "${AVDMANAGER}" create avd \
            --force \
            --name chrona-test \
            --package 'system-images;android-37.0;google_apis_ps16k;x86_64' \
            --device 'pixel_6'

          AVD_DIR="${AVD_ROOT}/chrona-test.avd"
          if [[ ! -f "${AVD_DIR}/config.ini" ]]; then
            echo "ERROR: AVD config was not created at ${AVD_DIR}/config.ini"
            echo 'Current AVD root contents:'
            find "${AVD_ROOT}" -maxdepth 2 -type f -print | sort || true
            exit 1
          fi

          cat >> "${AVD_DIR}/config.ini" <<'EOF'
          hw.cpu.ncore=4
          hw.ramSize=4096M
          hw.heapSize=512M
          hw.keyboard=yes
          EOF

          AVD_CONFIG="${ANDROID_AVD_HOME:-$HOME/.android/avd}/chrona-test.ini"
          if [[ ! -f "${AVD_CONFIG}" ]]; then
            echo "ERROR: AVD configuration was not created at ${AVD_CONFIG}"
            exit 1
          fi
          AVD_TARGET="$(grep '^target=' "${AVD_CONFIG}" || true)"
          if [[ "${AVD_TARGET}" != 'target=android-37.0' ]]; then
            echo "ERROR: Unexpected AVD target: ${AVD_TARGET:-<missing>}"
            cat "${AVD_CONFIG}"
            exit 1
          fi

          echo 'Created AVD:'
          "${AVDMANAGER}" list avd | sed -n '/Name: chrona-test/,/^$/p'
          echo "AVD target: ${AVD_TARGET}"

      - name: Run Android instrumentation tests
        shell: bash
        env:
          ANDROID_EMULATOR_WAIT_TIME_BEFORE_KILL: '10'
        run: |
          set -euo pipefail

          AVD_NAME='chrona-test'
          EMULATOR_PORT='5554'
          ADB="${ANDROID_SDK_ROOT}/platform-tools/adb"
          EMULATOR="${ANDROID_SDK_ROOT}/emulator/emulator"

          cleanup() {
            set +e
            "$ADB" -s "emulator-${EMULATOR_PORT}" emu kill >/dev/null 2>&1 || true
            pkill -f "${EMULATOR}.*-avd ${AVD_NAME}" >/dev/null 2>&1 || true
          }
          trap cleanup EXIT

          "$ADB" start-server

          "$EMULATOR" \
            -port "${EMULATOR_PORT}" \
            -avd "${AVD_NAME}" \
            -no-window \
            -gpu swiftshader_indirect \
            -no-snapshot \
            -noaudio \
            -no-boot-anim \
            -camera-back none \
            -camera-front none \
            -no-metrics \
            -accel on \
            > "${RUNNER_TEMP}/chrona-emulator.log" 2>&1 &
          EMULATOR_PID=$!

          for _ in $(seq 1 180); do
            STATE=$("$ADB" -s "emulator-${EMULATOR_PORT}" get-state 2>/dev/null || true)
            if [[ "$STATE" == 'device' ]]; then
              BOOT=$("$ADB" -s "emulator-${EMULATOR_PORT}" shell getprop sys.boot_completed 2>/dev/null | tr -d '\r' || true)
              if [[ "$BOOT" == '1' ]]; then
                break
              fi
            fi
            if ! kill -0 "$EMULATOR_PID" 2>/dev/null; then
              echo 'ERROR: Android emulator exited before boot completion.'
              cat "${RUNNER_TEMP}/chrona-emulator.log" || true
              exit 1
            fi
            sleep 2
          done

          if [[ "$("$ADB" -s "emulator-${EMULATOR_PORT}" shell getprop sys.boot_completed 2>/dev/null | tr -d '\r' || true)" != '1' ]]; then
            echo 'ERROR: Android emulator boot timed out.'
            cat "${RUNNER_TEMP}/chrona-emulator.log" || true
            exit 1
          fi

          "$ADB" -s "emulator-${EMULATOR_PORT}" shell settings put global window_animation_scale 0.0 || true
          "$ADB" -s "emulator-${EMULATOR_PORT}" shell settings put global transition_animation_scale 0.0 || true
          "$ADB" -s "emulator-${EMULATOR_PORT}" shell settings put global animator_duration_scale 0.0 || true

          TEST_EXIT=0
          ./gradlew --no-daemon --stacktrace --info --console=plain connectedOssDebugAndroidTest || TEST_EXIT=$?

          REPORT_DIR="${GITHUB_WORKSPACE}/artifacts/instrumented-test"
          mkdir -p "${REPORT_DIR}"

          if [[ -d "app/build/reports/androidTests/connected" ]]; then
            cp -a app/build/reports/androidTests/connected "${REPORT_DIR}/android-test-report"
          fi
          if [[ -d "app/build/outputs/androidTest-results" ]]; then
            cp -a app/build/outputs/androidTest-results "${REPORT_DIR}/android-test-results"
          fi

          "$ADB" -s "emulator-${EMULATOR_PORT}" shell getprop > "${REPORT_DIR}/device-properties.txt" 2>&1 || true
          "$ADB" -s "emulator-${EMULATOR_PORT}" shell dumpsys activity top > "${REPORT_DIR}/activity-top.txt" 2>&1 || true
          "$ADB" -s "emulator-${EMULATOR_PORT}" logcat -b all -d > "${REPORT_DIR}/logcat.txt" 2>&1 || true
          cp "${RUNNER_TEMP}/chrona-emulator.log" "${REPORT_DIR}/emulator.log" 2>/dev/null || true

          echo "Instrumentation test exit code: ${TEST_EXIT}"
          exit "${TEST_EXIT}"

      - name: Upload instrumentation diagnostics
        if: always()
        uses: actions/upload-artifact@v7.0.1
        with:
          name: chrona-instrumented-diagnostics-${{ github.sha }}
          path: artifacts/instrumented-test/
          if-no-files-found: warn
          retention-days: 14

  apk:
    name: Debug / ${{ matrix.abi }}
    needs: validation
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        abi: [arm64-v8a, armeabi-v7a, x86, x86_64]
    steps:
      - uses: actions/checkout@v7.0.1

      - uses: ./.github/actions/setup-android
        with:
          install-native: 'true'

      - name: Build debug APK
        run: ./gradlew --no-daemon --stacktrace assembleOssDebug -PchronaTargetAbi=${{ matrix.abi }}

      - name: Upload APK artifact
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.upload_artifact }}
        uses: actions/upload-artifact@v7.0.1
        with:
          name: chrona-debug-${{ matrix.abi }}-${{ github.sha }}
          path: app/build/outputs/apk/oss/debug/*.apk
          if-no-files-found: error
          retention-days: 14
