name: Chrona Device QA

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: chrona-device-qa-${{ github.ref }}
  cancel-in-progress: true

jobs:
  instrumentation:
    name: Android 16 / Pixel instrumentation
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      ANDROID_ADB_SERVER_PORT: '5037'
    steps:
      - uses: actions/checkout@v7.0.1
      - name: Enable KVM
        shell: bash
        run: |
          set -euxo pipefail

          echo "===== KVM BEFORE ====="
          ls -la /dev/kvm || true
          groups || true

          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules

          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

          if [[ -e /dev/kvm ]]; then
            sudo chmod 666 /dev/kvm
          fi

          echo "===== KVM AFTER ====="
          ls -la /dev/kvm

      - uses: ./.github/actions/setup-android
        with:
          install-native: 'true'
          install-emulator: 'true'

      - name: Verify emulator acceleration and ADB
        shell: bash
        run: |
          set -euxo pipefail

          echo "===== KVM ====="
          ls -la /dev/kvm
          test -r /dev/kvm
          test -w /dev/kvm

          echo "===== EMULATOR ACCELERATION ====="
          "${ANDROID_HOME}/emulator/emulator" -accel-check

          echo "===== ADB SERVER ====="
          "${ANDROID_HOME}/platform-tools/adb" start-server
          "${ANDROID_HOME}/platform-tools/adb" version
          "${ANDROID_HOME}/platform-tools/adb" devices -l
      - name: Install API 36 emulator image
        shell: bash
        run: |
          set -euo pipefail
          sdkmanager --sdk_root="${ANDROID_SDK_ROOT}" \
            'platforms;android-36' \
            'system-images;android-36;google_apis;x86_64'
          set +e
          yes | sdkmanager --licenses >/dev/null 2>&1
          rc=${PIPESTATUS[1]}
          set -e
          if [[ "$rc" -ne 0 ]]; then
            echo "::error::sdkmanager --licenses failed with exit code $rc"
            exit "$rc"
          fi

      - name: Verify toolchain
        run: bash scripts/ci/verify-toolchain.sh

      - name: Run emulator instrumentation
        uses: reactivecircus/android-emulator-runner@v2.38.0
        with:
          api-level: '36'
          target: google_apis
          arch: x86_64
          profile: pixel_6
          cores: 2
          ram-size: 4096M
          heap-size: 512M
          force-avd-creation: true
          disable-animations: true
          disable-spellchecker: true
          disable-linux-hw-accel: 'false'
          emulator-boot-timeout: 300
          emulator-options: >-
            -no-window
            -gpu swiftshader_indirect
            -skip-adb-auth
            -no-metrics
            -no-snapshot
            -noaudio
            -no-boot-anim
          pre-emulator-launch-script: |
            adb start-server
            adb version
            adb devices -l
          script: ./scripts/ci/device-smoke.sh

      - name: Upload instrumentation reports
        if: always()
        uses: actions/upload-artifact@v7.0.1
        with:
          name: chrona-device-qa-${{ github.sha }}
          path: |
            app/build/reports/androidTests/**
            app/build/outputs/androidTest-results/**
          if-no-files-found: warn
          retention-days: 14