name: Chrona Device QA

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: chrona-device-qa-${{ github.ref }}
  cancel-in-progress: true

jobs:
  instrumentation:
    name: Android 16 / Pixel instrumentation
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: ./.github/actions/setup-android
        with:
          install-native: 'true'
          install-emulator: 'true'
      - name: Install API 36 emulator image
        shell: bash
        run: |
          set -euo pipefail
          sdkmanager --sdk_root="${ANDROID_SDK_ROOT}" \
            'platforms;android-36' \
            'system-images;android-36;google_apis;x86_64'
          set +e
          yes | sdkmanager --licenses >/dev/null 2>&1
          rc=${PIPESTATUS[1]}
          set -e
          if [[ "$rc" -ne 0 ]]; then
            echo "::error::sdkmanager --licenses failed with exit code $rc"
            exit "$rc"
          fi

      - name: Verify toolchain
        run: bash scripts/ci/verify-toolchain.sh

      - name: Run emulator instrumentation
        uses: reactivecircus/android-emulator-runner@v2.38.0
        with:
          api-level: '36'
          target: google_apis
          arch: x86_64
          profile: pixel_6
          cores: 2
          ram-size: 4096M
          heap-size: 512M
          force-avd-creation: true
          disable-animations: true
          disable-spellchecker: true
          emulator-boot-timeout: 300
          emulator-options: >-
            -no-window
            -gpu swiftshader
            -no-snapshot
            -noaudio
            -no-boot-anim
          script: ./scripts/ci/device-smoke.sh

      - name: Upload instrumentation reports
        if: always()
        uses: actions/upload-artifact@v7.0.1
        with:
          name: chrona-device-qa-${{ github.sha }}
          path: |
            app/build/reports/androidTests/**
            app/build/outputs/androidTest-results/**
          if-no-files-found: warn
          retention-days: 14