name: Bootstrap Gradle Wrapper

on:
  workflow_dispatch:
  push:
    paths:
      - "gradle/wrapper/gradle-wrapper.properties"
      - ".github/workflows/bootstrap-gradle-wrapper.yml"

permissions:
  contents: write

concurrency:
  group: bootstrap-gradle-wrapper
  cancel-in-progress: false

env:
  GRADLE_VERSION: "9.6.1"
  JAVA_VERSION: "17"

jobs:
  bootstrap-gradle-wrapper:
    name: Bootstrap Gradle Wrapper
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}
          cache: gradle

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: ${{ env.GRADLE_VERSION }}

      - name: Show build environment
        shell: bash
        run: |
          set -euo pipefail

          echo "Java version:"
          java -version

          echo
          echo "Gradle version:"
          gradle --version

      - name: Generate Gradle Wrapper in isolated project
        shell: bash
        run: |
          set -euo pipefail

          TEMP_DIR="${RUNNER_TEMP}/gradle-wrapper-bootstrap"

          rm -rf "${TEMP_DIR}"
          mkdir -p "${TEMP_DIR}"

          cd "${TEMP_DIR}"

          cat > settings.gradle <<'EOF'
          pluginManagement {
              repositories {
                  gradlePluginPortal()
              }
          }

          rootProject.name = "gradle-wrapper-bootstrap"
          EOF

          cat > build.gradle <<'EOF'
          plugins {
              id "base"
          }
          EOF

          gradle wrapper \
            --gradle-version "${GRADLE_VERSION}" \
            --distribution-type bin

          echo "Generated wrapper files:"
          find "${TEMP_DIR}/gradle" -type f -print

          cp -R "${TEMP_DIR}/gradle/wrapper" \
            "${GITHUB_WORKSPACE}/gradle/"

          cp "${TEMP_DIR}/gradlew" \
            "${GITHUB_WORKSPACE}/gradlew"

          cp "${TEMP_DIR}/gradlew.bat" \
            "${GITHUB_WORKSPACE}/gradlew.bat"

          chmod +x "${GITHUB_WORKSPACE}/gradlew"

      - name: Force Gradle Wrapper version
        shell: bash
        working-directory: ${{ github.workspace }}
        run: |
          set -euo pipefail

          mkdir -p gradle/wrapper

          cat > gradle/wrapper/gradle-wrapper.properties <<EOF
          distributionBase=GRADLE_USER_HOME
          distributionPath=wrapper/dists
          distributionUrl=https\\://services.gradle.org/distributions/gradle-${GRADLE_VERSION}-bin.zip
          networkTimeout=10000
          validateDistributionUrl=true
          zipStoreBase=GRADLE_USER_HOME
          zipStorePath=wrapper/dists
          EOF

      - name: Validate no stale Gradle version remains
        shell: bash
        working-directory: ${{ github.workspace }}
        run: |
          set -euo pipefail

          if grep -RIn \
            --exclude-dir=.git \
            --exclude-dir=.gradle \
            --exclude-dir=build \
            --include='*.yml' \
            --include='*.yaml' \
            --include='*.properties' \
            --include='gradlew' \
            --include='gradlew.bat' \
            '9\.2\.0' .; then
            echo "::error::Gradle 9.6.1 masih ditemukan."
            exit 1
          fi

          if ! grep -q "gradle-${GRADLE_VERSION}-bin.zip" \
            gradle/wrapper/gradle-wrapper.properties; then
            echo "::error::Gradle Wrapper belum menggunakan versi ${GRADLE_VERSION}."
            exit 1
          fi

          echo "Tidak ditemukan Gradle 9.6.1."
          echo "Gradle Wrapper menggunakan ${GRADLE_VERSION}."

      - name: Validate Gradle Wrapper
        shell: bash
        working-directory: ${{ github.workspace }}
        run: |
          set -euo pipefail

          ./gradlew --version

      - name: Check changed files
        shell: bash
        working-directory: ${{ github.workspace }}
        run: |
          set -euo pipefail

          git status --short

      - name: Commit Gradle Wrapper changes
        shell: bash
        working-directory: ${{ github.workspace }}
        run: |
          set -euo pipefail

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add \
            gradle/wrapper/gradle-wrapper.properties \
            gradle/wrapper/gradle-wrapper.jar \
            gradlew \
            gradlew.bat \
            .github/workflows/bootstrap-gradle-wrapper.yml

          if git diff --cached --quiet; then
            echo "Tidak ada perubahan untuk di-commit."
            exit 0
          fi

          git commit -m "ci: update Gradle wrapper to 9.6.1"
          git push origin HEAD:${GITHUB_REF_NAME}
