name: Chrona Automation

on:
  pull_request_target:
    types: [opened, synchronize, reopened, ready_for_review, closed]
  issues:
    types: [opened, closed, reopened]
  schedule:
    - cron: '20 3 * * 1'
  workflow_dispatch:
    inputs:
      action:
        description: Automation task
        required: true
        type: choice
        options:
          - labels
          - changelog
          - crowdin

permissions:
  contents: read
  pull-requests: read
  issues: read

jobs:
  pr-notify:
    name: PR Telegram
    if: github.event_name == 'pull_request_target' && github.actor != 'dependabot[bot]'
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Send PR notification
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.CHRONABOT_PR_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.CHRONABOT_PR_CHAT_ID }}
          TELEGRAM_EVENT: pull-request
          GITHUB_TOKEN: ${{ github.token }}
        run: python3 scripts/telegram/notify.py
        continue-on-error: true

  dependabot-notify:
    name: Dependabot Telegram
    if: github.event_name == 'pull_request_target' && github.actor == 'dependabot[bot]'
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Send Dependabot notification
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.CHRONABOT_DEPENDABOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.CHRONABOT_DEPENDABOT_CHAT_ID }}
          TELEGRAM_EVENT: dependabot
          GITHUB_TOKEN: ${{ github.token }}
        run: python3 scripts/telegram/notify.py
        continue-on-error: true

  issue-notify:
    name: Issue Tracker Telegram
    if: github.event_name == 'issues'
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Send Issue notification
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.CHRONABOT_PR_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.CHRONABOT_PR_CHAT_ID }}
          TELEGRAM_EVENT: issue
          GITHUB_TOKEN: ${{ github.token }}
        run: python3 scripts/telegram/notify.py
        continue-on-error: true

  labels:
    name: Apply PR Labels
    if: github.event_name == 'pull_request_target' && github.event.action != 'closed'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: Apply labels
        uses: actions/labeler@v7
        with:
          repo-token: ${{ github.token }}
          sync-labels: false

  changelog:
    name: Generate Changelog
    if: github.event_name == 'workflow_dispatch' && inputs.action == 'changelog'
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Generate changelog
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/release/generate_changelog.py "${{ github.ref_name }}" > CHANGELOG.generated.md
      - name: Upload changelog
        uses: actions/upload-artifact@v7
        with:
          name: chrona-generated-changelog-${{ github.run_id }}
          archive: false
          path: CHANGELOG.generated.md
          if-no-files-found: error

  crowdin:
    name: Crowdin Sync
    if: (github.event_name == 'schedule') || (github.event_name == 'workflow_dispatch' && inputs.action == 'crowdin')
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Prepare localization branch
        run: |
          git fetch origin main crowdin-sync || true
          git checkout -B crowdin-sync origin/main
      - name: Resolve Crowdin project
        env:
          CROWDIN_PROJECT_ID: ${{ secrets.CROWDIN_PROJECT_ID || vars.CROWDIN_PROJECT_ID }}
        run: |
          [[ -n "$CROWDIN_PROJECT_ID" ]] || { printf 'CROWDIN_PROJECT_ID is required.\n' >&2; exit 1; }
          sed -i "s/^project_id: .*/project_id: $CROWDIN_PROJECT_ID/" crowdin.yml
      - name: Sync translations
        uses: crowdin/github-action@v3
        env:
          GITHUB_TOKEN: ${{ github.token }}
          CROWDIN_PERSONAL_TOKEN: ${{ secrets.CROWDIN_PERSONAL_TOKEN }}
        with:
          upload_sources: true
          upload_translations: false
          download_translations: true
          push_translations: false
          push_sources: false
          create_pull_request: false
          localization_branch_name: crowdin-sync
          skip_ref_checkout: true
      - name: Configure FebriCahyaa Bot signing
        env:
          CHRONABOT_GPG_PRIVATE_KEY: ${{ secrets.CHRONABOT_GPG_PRIVATE_KEY }}
          CHRONABOT_GPG_PASSPHRASE: ${{ secrets.CHRONABOT_GPG_PASSPHRASE }}
        run: bash scripts/release/setup_ci_git_signing.sh
      - name: Commit and push signed translations
        env:
          GIT_AUTHOR_NAME: FebriCahyaa
          GIT_AUTHOR_EMAIL: febricahya12345@gmail.com
        run: |
          if [[ -z "$(git status --porcelain)" ]]; then
            printf 'No translation changes detected.\n'
            exit 0
          fi
          git add -A
          git commit -S -m 'chore(i18n): synchronize Crowdin translations'
          git push --force-with-lease --set-upstream origin crowdin-sync
      - name: Create or update localization pull request
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if ! git log origin/main..HEAD --oneline | grep -q .; then
            printf 'No localization commit to publish.\n'
            exit 0
          fi
          if gh pr view crowdin-sync --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            printf 'Localization pull request already exists.\n'
            exit 0
          fi
          gh pr create \
            --repo "$GITHUB_REPOSITORY" \
            --base main \
            --head crowdin-sync \
            --title 'chore(i18n): synchronize Crowdin translations' \
            --body 'Automated Crowdin translation synchronization.' \
            --label translations
      - name: Notify localization sync
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.CHRONABOT_PR_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.CHRONABOT_PR_CHAT_ID }}
          TELEGRAM_EVENT: crowdin
        run: python3 scripts/telegram/notify.py
        continue-on-error: true

  bootstrap-labels:
    name: Bootstrap Labels
    if: github.event_name == 'workflow_dispatch' && inputs.action == 'labels'
    runs-on: ubuntu-24.04
    permissions:
      issues: write
    steps:
      - name: Create labels
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        shell: bash
        run: |
          gh label create 'bug' --color 'd73a4a' --description 'Confirmed or reproducible defect' --force
          gh label create 'enhancement' --color 'a2eeef' --description 'Feature or improvement' --force
          gh label create 'ci' --color '5319e7' --description 'Continuous integration and automation' --force
          gh label create 'build-system' --color '1d76db' --description 'Gradle, Soong, Android build configuration' --force
          gh label create 'security' --color 'b60205' --description 'Security-related change' --force
          gh label create 'dependencies' --color '0366d6' --description 'Dependency or toolchain update' --force
          gh label create 'translations' --color '7057ff' --description 'Localization and translation' --force
          gh label create 'documentation' --color '0075ca' --description 'Documentation' --force
          gh label create 'breaking' --color 'b60205' --description 'Behavior or API compatibility impact' --force
          gh label create 'android' --color '3ddc84' --description 'Application source, resources or manifest' --force
          gh label create 'automation' --color 'c5def5' --description 'GitHub configuration and automation' --force
          gh label create 'skip-changelog' --color 'eeeeee' --description 'Excluded from Release Drafter notes' --force
