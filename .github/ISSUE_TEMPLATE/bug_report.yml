name: Bug report
description: Report a reproducible Chrona bug.
title: "[Bug] "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: Provide enough detail for the issue to be reproduced and triaged.
  - type: input
    id: version
    attributes:
      label: Chrona version
      placeholder: 1.0.0 or commit SHA
    validations:
      required: true
  - type: input
    id: device
    attributes:
      label: Device and Android version
      placeholder: Pixel 8, Android 16
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Reproduction steps
      placeholder: Describe the smallest sequence that reproduces the issue.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Logs or screenshots
      render: text
