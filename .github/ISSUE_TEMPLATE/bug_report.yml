name: Bug report
description: Report a reproducible Chrona bug.
title: "bug: "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Please provide reproducible evidence. Never include tokens, private data, or signing material.
  - type: input
    id: version
    attributes:
      label: Chrona version
      placeholder: 0.5.0
    validations:
      required: true
  - type: input
    id: commit
    attributes:
      label: Commit SHA
      placeholder: 12-character or full SHA
  - type: input
    id: android
    attributes:
      label: Android version / API level
      placeholder: Android 17 / API 37
    validations:
      required: true
  - type: input
    id: device
    attributes:
      label: Device
      placeholder: Pixel 9 / emulator
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: 1. Open ...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Relevant logs / screenshots
      description: Remove secrets and personal data before posting.
  - type: checkboxes
    id: regression
    attributes:
      label: Regression check
      options:
        - label: I checked whether this worked in an earlier Chrona build.
        - label: I removed secrets and personal data from attached logs.
